name: Build Tauri Windows Release

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击触发
  push:
    tags:
      - 'v*' # 推送 v* 标签（例如 v0.1.0）自动触发打包并发布 Release

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Frontend
        run: pnpm run build:prod

      - name: Build Tauri Desktop App
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          New-Item -ItemType Directory -Force -Path temp-portable

          # 1. 查找 NSIS 安装包并命名
          $nsisInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisInstaller) {
            Copy-Item $nsisInstaller.FullName -Destination "release-assets/windows-x64.exe"
            Copy-Item $nsisInstaller.FullName -Destination "release-assets/wedesk-0.1.0-windows-x64.exe"
            Write-Host "Found Installer: $($nsisInstaller.FullName)"
          } else {
            Write-Error "NSIS installer not found!"
          }

          # 2. 查找二进制 exe 并生成绿色便携压缩包
          $mainExe = Get-ChildItem -Path "src-tauri/target/release/*.exe" -Exclude "*.temp" | Where-Object { $_.Name -like "wedesk*.exe" -or $_.Name -like "app*.exe" } | Select-Object -First 1
          if ($mainExe) {
            Copy-Item $mainExe.FullName -Destination "temp-portable/Wedesk.exe"
            Compress-Archive -Path "temp-portable/*" -DestinationPath "release-assets/windows-x64-portable.zip" -Force
            Copy-Item "release-assets/windows-x64-portable.zip" -Destination "release-assets/wedesk-0.1.0-windows-x64-portable.zip"
            Write-Host "Created Portable zip with executable: $($mainExe.FullName)"
          } else {
            Write-Error "Main executable not found for portable zip!"
          }

          Get-ChildItem -Path release-assets

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wedesk-Windows-x64
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
