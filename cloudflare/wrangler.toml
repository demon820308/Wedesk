name = "wedesk-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "SIGNALING_HUB", class_name = "SignalingHub" }
]

[[migrations]]
tag = "v1"
new_classes = ["SignalingHub"]

[[d1_databases]]
binding = "DB"
database_name = "wedesk-db"
database_id = "YOUR_D1_DATABASE_ID"
